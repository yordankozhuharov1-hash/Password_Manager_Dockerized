<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-card">

    <h2 class="cyber-title text-center mb-4">
        Edit Entry
    </h2>

    <form method="POST">

        <input
            type="text"
            name="site"
            value="{{ entry.site }}"
            class="form-control mb-3"
            required>

        <input
            type="text"
            name="username"
            value="{{ entry.account_username }}"
            class="form-control mb-3"
            required>

        <input
            type="password"
            name="password"
            class="form-control mb-3"
            placeholder="New Password"
            required>

        <button
            type="submit"
            class="btn btn-warning w-100">

            Save Changes

        </button>

    </form>

</div>

</body>
</html>
